name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller keyboard cryptography pillow
    
    - name: Create empty database files
      run: |
        New-Item -ItemType File -Path "troll_users.db" -Force
        New-Item -ItemType File -Path "troll_settings.json" -Force
        '{}' | Out-File -FilePath "troll_settings.json" -Encoding utf8
    
    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --name "AWESOMETROLLING" --add-data "troll_users.db;." --add-data "troll_settings.json;." --hidden-import keyboard --hidden-import cryptography --hidden-import cryptography.fernet --hidden-import cryptography.hazmat.primitives --hidden-import cryptography.hazmat.primitives.kdf.pbkdf2 --hidden-import cryptography.hazmat.backends --hidden-import sqlite3 --hidden-import json --hidden-import threading --hidden-import time --hidden-import random --hidden-import re --hidden-import os --hidden-import sys --hidden-import subprocess --hidden-import platform --hidden-import ctypes --hidden-import uuid --hidden-import hashlib --hidden-import base64 --hidden-import zlib main.py
    
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: AWESOMETROLLING
        path: dist/AWESOMETROLLING.exe
