name: Build and Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller cryptography keyboard
    
    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --name "AWESOMETROLLING" main.py
    
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: AWESOMETROLLING
        path: dist/AWESOMETROLLING.exe
